id = "csv"
name = "CSV"
description = "CSV language support."
version = "0.0.3"
schema_version = 1
authors = ["Jason Lee <huacnlee@gmail.com>"]
repository = "https://github.com/huacnlee/zed-csv"

# One grammar per delimiter: tree-sitter bakes the separator into the parser,
# so the delimiter is chosen by picking the language, not by a setting.
[grammars.csv]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-csv"
commit = "f6bf6e35eb0b95fbadea4bb39cb9709507fcb181"
path = "csv"

[grammars.tsv]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-csv"
commit = "f6bf6e35eb0b95fbadea4bb39cb9709507fcb181"
path = "tsv"

[grammars.psv]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-csv"
commit = "f6bf6e35eb0b95fbadea4bb39cb9709507fcb181"
path = "psv"

# Vendored in this repo (tree-sitter-scsv/). Pin to a pushed commit that contains it.
[grammars.scsv]
repository = "https://github.com/dprinzensteiner/zed-csv"
commit = "TODO-push-and-pin"
path = "tree-sitter-scsv/scsv"
